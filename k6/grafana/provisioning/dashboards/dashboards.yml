# Auto-loads every dashboard JSON in this folder on Grafana start.
# Mounted at /etc/grafana/provisioning by k6/grafana/docker-compose.yml.
apiVersion: 1

providers:
  - name: k6
    orgId: 1
    folder: k6
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
